spring.config.import=optional:classpath:application-secret.properties
spring.application.name=campus_backend
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/campus_project
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
logging.level.org.springframework.security=TRACE
#logging.level.org.springframework.security.oauth2=TRACE

# File Upload Limits (allow up to 50MB PDF uploads)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# =====================================================
# GMAIL SMTP CONFIGURATION (FOR STUDENT LOGIN OTP)
# Sensitive values are loaded from application-secret.properties
# =====================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_16_char_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=20000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000




